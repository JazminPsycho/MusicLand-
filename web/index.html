<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAPs Música</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#heading">Ir al contenido</a>
<div class="shell">
  <header>
    <a class="brand" href="./"><span class="record" aria-hidden="true"></span><span>JAPs <i>Música</i></span></a>
    <nav aria-label="Principal">
      <button id="library">Biblioteca</button><button id="import" hidden>Importar</button>
      <button id="summary" hidden>Escuchas</button><button id="users" hidden>Cuentas</button>
    </nav>
    <div class="account" id="account" hidden><span id="account-name"></span><button id="logout" hidden>Salir</button></div>
  </header>
  <main>
    <div class="masthead"><p class="eyebrow" id="section-name">JAPs Música</p><h1 id="heading" tabindex="-1">Mi biblioteca</h1></div>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="content" aria-labelledby="heading"></section>
    <footer><a id="portfolio">Un proyecto de Jazmín Schürrer</a><p>La app registra actividad de reproducción para el resumen de escuchas.</p></footer>
  </main>
</div>
<aside id="player" hidden aria-label="Reproductor">
  <div class="playing"><span class="record" aria-hidden="true"></span><div><strong id="now">Elegí una canción</strong><span id="artist"></span></div></div>
  <div class="controls"><button id="previous" aria-label="Pista anterior" title="Pista anterior">|◀</button><button id="toggle">Reproducir</button><button id="next" aria-label="Pista siguiente" title="Pista siguiente">▶|</button></div>
  <label class="timeline"><span id="elapsed">0:00</span><input id="seek" aria-label="Posición de reproducción" type="range" min="0" max="100" step=".1" value="0"><span id="duration">0:00</span></label>
  <audio id="audio" preload="metadata"></audio>
</aside>
</body>
</html>
